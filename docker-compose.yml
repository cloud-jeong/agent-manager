services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent_manager
      POSTGRES_PASSWORD: agent_manager
      POSTGRES_DB: agent_manager
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_manager"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      AGENT_MANAGER_DATABASE_URL: postgresql+asyncpg://agent_manager:agent_manager@postgres:5432/agent_manager
      AGENT_MANAGER_JWT_SECRET: ${AGENT_MANAGER_JWT_SECRET:-dev-only-secret-change-me-in-production}
      AGENT_MANAGER_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Executes agent runs. Needs the Docker socket to start sandbox containers
  # (build their image first with `make sandbox-image`). Access to the socket is
  # root-equivalent on the host: see docs/runtime-plan.md before deploying this.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      AGENT_MANAGER_DATABASE_URL: postgresql+asyncpg://agent_manager:agent_manager@postgres:5432/agent_manager
      AGENT_MANAGER_SANDBOX_RUNTIME: ${AGENT_MANAGER_SANDBOX_RUNTIME:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        # The backend container applies migrations on start.
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
